<!DOCTYPE html>

<style>

.icon{width:512px;height:512px;display:block}

<body>
<!-- 方案 A：古典字母襯線標章 -->

    <path d="M150 300 C140 250 150 210 170 190 L162 132 L205 168 C222 162 244 162 262 168 L300 134 L298 192 C318 214 324 250 312 290 C298 334 262 352 228 352 C190 352 160 334 150 300 Z"/>

  <circle cx="256" cy="140" r="26" fill="none" stroke="#F8F7F4" stroke-width="5"/>
  <!-- 圓形名牌 -->
  <circle cx="256" cy="280" r="118" fill="#F8F7F4"/>
  <circle cx="256" cy="280" r="104" fill="none" stroke="#2A2A2A" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="256" cy="182" r="7" fill="#2A2A2A"/>
